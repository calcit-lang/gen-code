name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1.4.0
        with:
          tools: calcit,caps
          caps-version: "0.1.0"

      - name: Install dependencies
        run: |
          caps --strict --ci
          yarn install --immutable

      - name: Verify Calcit runtime toolchain
        run: caps verify --toolchain

      - name: Check canonical snapshot
        run: |
          calcit edit format
          git diff --exit-code -- calcit.cirru

      - name: Check Calcit types
        run: |
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze dynamic-methods --max 0
          calcit calcit.cirru analyze deprecated
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

      - name: Test Reel state boundary
        run: |
          calcit test gen-code.schema/read-open-field-or \
            --name present-and-missing-store --require-match
          calcit test gen-code.schema/decode-gen-code-op --require-match

      - name: Build
        run: |
          calcit calcit.cirru js
          yarn test:stream
          yarn vite build --base=./

      - name: Deploy to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
