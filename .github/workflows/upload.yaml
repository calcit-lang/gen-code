name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Install dependencies
        run: |
          caps --strict --ci
          yarn install --immutable

      - name: Verify Calcit runtime toolchain
        run: caps verify --toolchain

      - name: Check canonical snapshot
        run: |
          calcit edit format
          git diff --exit-code -- calcit.cirru

      - name: Check Calcit types
        run: |
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze dynamic-methods
          calcit calcit.cirru analyze deprecated
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

      - name: Test Reel state boundary
        run: |
          calcit test gen-code.schema/read-open-field-or \
            --name present-and-missing-store --require-match
          calcit test gen-code.schema/decode-gen-code-op --require-match

      - name: Select COS prefix
        id: cos-path
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "prefix=${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=${GITHUB_REPOSITORY}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_BASE_URL: https://cos-sh.tiye.me/${{ steps.cos-path.outputs.prefix }}
        run: |
          calcit calcit.cirru js
          yarn test:stream
          yarn vite build

      - name: Upload static assets to COS
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: worktools/cos-upload-action@17e6d213fe9f6772a6090a13c8ba044cd6cbcb09 # v1.1.1
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.cos-path.outputs.prefix }}
          public-base-url: https://cos-sh.tiye.me/${{ steps.cos-path.outputs.prefix }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
          routines: '2'
          thread-num: '4'
          retry-count: '3'

      - name: Deploy to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
